[project]
name = "eloscope"
version = "1.0.0"
description = "What really makes chess players win? An analysis of Lichess games."
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E501"]  # declarative report layout, one visual per line
